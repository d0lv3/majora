<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/visual-identity/logo-web.png" />
    <meta
      name="description"
      content="Majora: discover where you fit. Understand every university major in Kurdistan, whether you are choosing one or already studying it."
    />
    <meta name="theme-color" content="#412b63" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fetched without blocking the first paint. A plain stylesheet link here
      holds the whole document back until it answers — including the splash
      below, which is the one thing that must not wait on the network. The
      media switch is the trick: a sheet that only applies to print is not
      render-blocking, and onload promotes it to the real thing the moment it
      lands. Both faces are already display=swap, so the swap this causes is
      the one that was going to happen anyway.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Majora: Discover Where You Fit</title>

    <!--
      THE SPLASH.

      Markup and styles both inline, and both above the module script, because
      the whole point is that this is on screen before anything else is: a
      splash that arrives with the bundle it is covering for has missed its
      job. Nothing here waits on the stylesheet, the fonts or the JS.

      The mark is the logo, traced off the artwork in visual-identity/logo.png
      and rebuilt at a 200x200 viewBox — the house frame, the open book, the
      mortarboard, and the gold tassel hanging off the frame's left edge where
      that stroke stops.

      The cap is drawn twice on purpose. Its outline is stroked so it can draw
      itself like everything else, and then a filled copy fades in over it with
      the M cut out of it by fill-rule="evenodd". That is what the logo
      actually is — a solid diamond with the letter reversed out of it, not a
      diamond and an M sitting next to each other — and it is the difference
      between a mark that resembles the logo and one that is the logo.

      Every stroked path carries pathLength="1", so one dash unit is the whole
      path whatever its real length and no measurement has to be kept in sync.

      main.jsx takes it down once React has mounted; see removeSplash() there.
    -->
    <style>
      /*
        THE CURTAIN, AND WHY THE APP USES IT TOO.

        #splash is the one that has to be here, inline, before anything else
        loads. .brandCurtain is the same screen rendered from inside the app —
        while a route's chunk arrives, while the map's tiles do, while a
        simulation's scenes do — and it shares this rule rather than owning a
        copy of it.

        That is the whole point: a reader who saw the mark draw itself on the
        way in should see the same screen, drawn the same way, at every other
        wait. Two stylesheets would have been two answers to that within a
        month. This block survives the splash being removed from the document,
        so BrandLoader.jsx can rely on it — see the note there.
      */
      #splash,
      .brandCurtain {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.4rem;
        background: #412b63;
        background-image: radial-gradient(
          90% 70% at 50% 35%,
          rgba(107, 78, 148, 0.7),
          transparent 65%
        );
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #splash.is-done {
        opacity: 0;
        visibility: hidden;
      }

      /* Sized by height, because the box is now the drawing.

         It used to be a square 200x200 with the mark loose inside it, and the
         slack was not even: 10.65 units of air over the frame's peak and 19.2
         under the book's foot. place-content centres boxes, not ink, so the
         thing anybody could actually see — mark, then wordmark — sat low on
         the screen and the gap under the mark read as too big. The viewBox is
         cut to the ink instead, so centring the box is centring the logo. */
      .splash__mark {
        height: clamp(102px, 22.1vmin, 162px);
        width: auto;
        overflow: visible;
        /* Once the mark is drawn it breathes, so a slow connection gets a
           screen that is still alive rather than a still image.

           It starts well clear of the last stroke rather than a beat after it.
           On a load that is ready on time the splash lifts before this ever
           runs, which is the point: at 1.7s it began scaling down just as the
           fade started, and the two read as one unsteady movement. Now it only
           appears when there is genuinely something to wait for. */
        animation: splashBreathe 2.6s ease-in-out 1.85s infinite;
      }

      /* Drawn is the resting state and the keyframes come from nowhere, not
         the other way round. That ordering is what lets the reduced-motion
         rule below cancel the animation and leave a finished logo rather than
         a blank square.

         An opt-in class rather than a selector that reaches for every path.
         The tassel's strands are a path and the filled cap is a path, and
         neither wants a white stroke dashed to nothing.

         All one class deep, deliberately. This rule sets the `animation`
         shorthand, which writes every animation longhand including the delay
         and the duration, so anything overriding those has to outrank it. The
         four rules under it are the same weight and come later, which is what
         makes them stick — the previous version had this rule one step
         stronger, and every stroke drew at once with the stagger doing
         nothing at all. */
      .splash__stroke {
        fill: none;
        stroke: #ffffff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: splashDraw 0.56s cubic-bezier(0.65, 0, 0.35, 1) backwards;
      }

      .splash__frame {
        stroke-width: 7.7;
        animation-delay: 0.04s;
      }

      .splash__book {
        stroke-width: 7.6;
        animation-delay: 0.3s;
        animation-duration: 0.5s;
      }

      .splash__pages {
        stroke-width: 7.6;
        animation-delay: 0.4s;
        animation-duration: 0.44s;
      }

      /* The mark's one solid shape, and the only thing here that is not drawn.
         The mortarboard in the logo is a filled diamond with the M cut out of
         it, not an outline — so it arrives as one, fading in over the strokes
         rather than being traced. Tracing it would have left a stroked rim
         standing 3 units outside the fill when the fill landed, which is a
         hairline the logo does not have.

         Opacity is the resting state, so reduced motion keeps the solid cap
         and simply skips the fade. */
      .splash__capFill {
        fill: #ffffff;
        animation: splashFill 0.3s ease 0.72s backwards;
      }

      /* The one gold thing on the screen, and the last to arrive, so the eye
         finishes on it. An ellipse cannot be dash-drawn the way a line can,
         so the tassel swings in instead of being traced. */
      .splash__tassel {
        transform-origin: 30.25px 106.5px;
        animation: splashTassel 0.38s cubic-bezier(0.34, 1.4, 0.5, 1) 0.84s backwards;
      }

      .splash__knot {
        fill: #eeaf16;
      }

      .splash__strands {
        fill: none;
        stroke: #eeaf16;
        stroke-width: 5.5;
        stroke-linecap: round;
      }

      .splash__word {
        margin: 0;
        font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        font-size: clamp(1.1rem, 3.5vmin, 1.5rem);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
        animation: splashWord 0.34s ease 0.92s backwards;
      }

      @keyframes splashDraw {
        from {
          stroke-dashoffset: 1;
        }
      }

      @keyframes splashFill {
        from {
          opacity: 0;
        }
      }

      @keyframes splashTassel {
        from {
          opacity: 0;
          transform: rotate(-14deg);
        }
      }

      @keyframes splashWord {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      @keyframes splashBreathe {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.82;
          transform: scale(0.985);
        }
      }

      /* No drawing, no swing, no fade — the logo is simply already there while
         the app loads behind it. main.jsx reads the same query and drops its
         minimum display time to match, so nobody is held on a still image.

         `.splash__mark *` matches the stroked paths at the same weight as
         their own rules and comes later, so it wins. The filled cap keeps its
         resting opacity of 1 because splashFill only ever set 0 in a `from`. */
      @media (prefers-reduced-motion: reduce) {
        #splash,
        .splash__mark,
        .splash__mark *,
        .splash__word {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Majora">
      <!--
        Every coordinate below was measured off logo.png rather than eyeballed:
        the image was sampled on a grid and the runs of ink read back, which is
        why the mark is centred on x=104.5 and not on 100. The artwork is
        composed with the tassel hanging outside the frame, so the frame sits
        right of centre and the whole thing balances. Moving it to 100 is what
        made the previous version look like a different logo.

        Which is why the viewBox is not that 200x200 square but the ink's own
        bounding box, strokes included: x 20.15 to 182.5, y 10.65 to 180.8. The
        path data is untouched — this only says where the drawing's edges are,
        so the mark centres on whatever centres this element, and the wordmark
        under it lines up with the logo rather than with the logo's padding.
      -->
      <svg class="splash__mark" viewBox="20.15 10.65 162.35 170.15" aria-hidden="true">
        <!-- The house frame, as one stroke. It starts where the tassel hangs —
             the left edge stops at y=106.5 in the artwork, and that break is
             what the tassel hangs from — then runs up over the peak, down the
             right side and back along the bottom. -->
        <path
          class="splash__stroke splash__frame"
          pathLength="1"
          d="M30.25 106.5V70Q30.25 65 34.5 62L100.5 16Q104.5 13 108.5 16L174.5 62Q178.65 65 178.65 70V157Q178.65 162.15 173.5 162.15H48"
        />
        <!-- The open book, one page each. Both run straight down and then
             break toward the spine, crossing under the frame's bottom edge and
             meeting below it — which is what gives the logo its dipped foot. -->
        <path
          class="splash__stroke splash__book"
          pathLength="1"
          d="M64.6 111V146Q90 153 104.5 177"
        />
        <path
          class="splash__stroke splash__pages"
          pathLength="1"
          d="M145.6 111V146Q119 153 104.5 177"
        />

        <!-- The mortarboard: one path, two subpaths, and evenodd cuts the
             second out of the first. That is the letter reversed out of the
             diamond rather than drawn on top of it. -->
        <path
          class="splash__capFill"
          fill-rule="evenodd"
          d="M104.5 47.4L167 87.8L104.5 128.2L42.1 87.8Z M80.5 100V74H93L104.5 87.5L116 74H128.5V100H118.7V82L104.5 96.5L90.5 82V100Z"
        />

        <g class="splash__tassel">
          <ellipse class="splash__knot" cx="30.2" cy="118.2" rx="7.2" ry="5.6" />
          <path class="splash__strands" d="M26 125 22.9 149M30.2 125V154M34.4 125 37.4 149" />
        </g>
      </svg>

      <p class="splash__word">Majora</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

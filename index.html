<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/visual-identity/logo-web.png" />
    <meta
      name="description"
      content="Majora: discover where you fit. Understand every university major in Kurdistan, whether you are choosing one or already studying it."
    />
    <meta name="theme-color" content="#412b63" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fetched without blocking the first paint. A plain stylesheet link here
      holds the whole document back until it answers — including the splash
      below, which is the one thing that must not wait on the network. The
      media switch is the trick: a sheet that only applies to print is not
      render-blocking, and onload promotes it to the real thing the moment it
      lands. Both faces are already display=swap, so the swap this causes is
      the one that was going to happen anyway.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Majora: Discover Where You Fit</title>

    <!--
      THE SPLASH.

      Markup and styles both inline, and both above the module script, because
      the whole point is that this is on screen before anything else is: a
      splash that arrives with the bundle it is covering for has missed its
      job. Nothing here waits on the stylesheet, the fonts or the JS.

      The mark is the logo, traced off the artwork in visual-identity/logo.png
      and rebuilt at a 200x200 viewBox — the house frame, the open book, the
      mortarboard, and the gold tassel hanging off the frame's left edge where
      that stroke stops.

      The cap is drawn twice on purpose. Its outline is stroked so it can draw
      itself like everything else, and then a filled copy fades in over it with
      the M cut out of it by fill-rule="evenodd". That is what the logo
      actually is — a solid diamond with the letter reversed out of it, not a
      diamond and an M sitting next to each other — and it is the difference
      between a mark that resembles the logo and one that is the logo.

      Every stroked path carries pathLength="1", so one dash unit is the whole
      path whatever its real length and no measurement has to be kept in sync.

      main.jsx takes it down once React has mounted; see removeSplash() there.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.4rem;
        background: #412b63;
        background-image: radial-gradient(
          90% 70% at 50% 35%,
          rgba(107, 78, 148, 0.7),
          transparent 65%
        );
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #splash.is-done {
        opacity: 0;
        visibility: hidden;
      }

      .splash__mark {
        width: clamp(120px, 26vmin, 190px);
        height: clamp(120px, 26vmin, 190px);
        overflow: visible;
        /* Once the mark is drawn it breathes, so a slow connection gets a
           screen that is still alive rather than a still image.

           It starts well clear of the last stroke rather than a beat after it.
           On a load that is ready on time the splash lifts before this ever
           runs, which is the point: at 1.7s it began scaling down just as the
           fade started, and the two read as one unsteady movement. Now it only
           appears when there is genuinely something to wait for. */
        animation: splashBreathe 2.6s ease-in-out 1.85s infinite;
      }

      /* Drawn is the resting state and the keyframes come from nowhere, not
         the other way round. That ordering is what lets the reduced-motion
         rule below cancel the animation and leave a finished logo rather than
         a blank square.

         An opt-in class rather than a selector that reaches for every path.
         The tassel's strands are a path and the filled cap is a path, and
         neither wants a white stroke dashed to nothing.

         All one class deep, deliberately. This rule sets the `animation`
         shorthand, which writes every animation longhand including the delay
         and the duration, so anything overriding those has to outrank it. The
         four rules under it are the same weight and come later, which is what
         makes them stick — the previous version had this rule one step
         stronger, and every stroke drew at once with the stagger doing
         nothing at all. */
      .splash__stroke {
        fill: none;
        stroke: #ffffff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: splashDraw 0.56s cubic-bezier(0.65, 0, 0.35, 1) backwards;
      }

      .splash__frame {
        stroke-width: 6;
        animation-delay: 0.04s;
      }

      .splash__book {
        stroke-width: 5.5;
        animation-delay: 0.3s;
        animation-duration: 0.5s;
      }

      .splash__pages {
        stroke-width: 5.5;
        stroke-opacity: 0.85;
        animation-delay: 0.4s;
        animation-duration: 0.44s;
      }

      .splash__cap {
        stroke-width: 5.5;
        animation-delay: 0.56s;
        animation-duration: 0.4s;
      }

      /* The mark's one solid shape, arriving over its own outline: the
         mortarboard as the logo has it, with the M cut out rather than laid
         on. Opacity is the resting state so reduced motion keeps the filled
         cap and simply skips the fade. */
      .splash__capFill {
        fill: #ffffff;
        animation: splashFill 0.26s ease 0.92s backwards;
      }

      /* The one gold thing on the screen, and the last to arrive, so the eye
         finishes on it. An ellipse cannot be dash-drawn the way a line can,
         so the tassel swings in instead of being traced. */
      .splash__tassel {
        transform-origin: 26px 108px;
        animation: splashTassel 0.38s cubic-bezier(0.34, 1.4, 0.5, 1) 0.84s backwards;
      }

      .splash__knot {
        fill: #eeaf16;
      }

      .splash__strands {
        fill: none;
        stroke: #eeaf16;
        stroke-width: 5.5;
        stroke-linecap: round;
      }

      .splash__word {
        margin: 0;
        font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        font-size: clamp(1.1rem, 3.5vmin, 1.5rem);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
        animation: splashWord 0.34s ease 0.92s backwards;
      }

      @keyframes splashDraw {
        from {
          stroke-dashoffset: 1;
        }
      }

      @keyframes splashFill {
        from {
          opacity: 0;
        }
      }

      @keyframes splashTassel {
        from {
          opacity: 0;
          transform: rotate(-14deg);
        }
      }

      @keyframes splashWord {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      @keyframes splashBreathe {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.82;
          transform: scale(0.985);
        }
      }

      /* No drawing, no swing, no fade — the logo is simply already there while
         the app loads behind it. main.jsx reads the same query and drops its
         minimum display time to match, so nobody is held on a still image. */
      @media (prefers-reduced-motion: reduce) {
        #splash,
        .splash__mark,
        .splash__mark path,
        .splash__tassel,
        .splash__word {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Majora">
      <svg class="splash__mark" viewBox="0 0 200 200" aria-hidden="true">
        <!-- the outer frame, one stroke from the tassel point all the way
             round to the stub at the bottom left, exactly as the logo breaks
             it -->
        <path
          class="splash__frame"
          pathLength="1"
          d="M27 109V72Q27 66 32 62L100 13Q105 10 110 13L174 62Q179 66 179 72V158Q179 164 173 164H52Q46 164 46 158V150"
        />
        <!-- the open book: down the left page, across the fold, up the right -->
        <path
          class="splash__book"
          pathLength="1"
          d="M61 106V150Q83 155 105 174Q127 155 147 150V106"
        />
        <!-- the mortarboard -->
        <path class="splash__cap" pathLength="1" d="M104 46 167 86 104 126 41 86Z" />
        <path class="splash__m" pathLength="1" d="M84 100V75L105 92 126 75V100" />

        <g class="splash__tassel">
          <ellipse class="splash__knot" cx="30" cy="117" rx="8.5" ry="6.5" />
          <path class="splash__strands" d="M30 123 22 151M30 124V153M30 123 38 150" />
        </g>
      </svg>

      <p class="splash__word">Majora</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
